<!-- Header Actions -->
<header
    class="flex flex-col md:flex-row md:items-end justify-between mb-unit-8 gap-unit-4"
>
    <h1
        class="font-display text-display text-on-surface text-2xl md:text-display"
    >
        Registered Applications
    </h1>
    <button
        class="w-full md:w-auto bg-primary-container text-on-primary-container hover:opacity-90 px-unit-4 py-unit-2 rounded font-body-md text-body-md flex items-center justify-center gap-unit-2 transition-all active:scale-95 shadow-lg shadow-primary/10"
        (click)="openModal()"
    >
        <span class="material-symbols-outlined" data-icon="add">add</span>
        Create New Application
    </button>
</header>

<!-- Bento Grid Layout -->
<div class="space-y-unit-4">
    <!-- App Grid Section -->
    <section class="mt-unit-4">
        <app-app-grid />
    </section>
</div>
